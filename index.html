<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velvet Mirage Studio</title>
    <meta name="description" content="Créateur de personnage et de prompt pour un univers romantique adulte cinématographique." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="logo">V</div>
          <div>
            <span class="eyebrow">Studio</span>
            <h1>Velvet Mirage</h1>
          </div>
        </div>
        <div class="status-pill">AI love story generator</div>
      </header>

      <main class="layout">
        <aside class="panel builder-panel">
          <div class="panel-header">
            <p class="eyebrow">Character Builder</p>
            <h2>Créer une héroïne</h2>
          </div>

          <div class="field-group">
            <label for="nameInput">Nom du personnage</label>
            <input id="nameInput" type="text" value="Arielle Voss" maxlength="30" />
          </div>

          <div class="field-group">
            <label for="titleInput">Titre</label>
            <input id="titleInput" type="text" value="Princesse des ombres" maxlength="40" />
          </div>

          <div class="field-group">
            <label for="archetypeSelect">Archétype</label>
            <select id="archetypeSelect">
              <option value="mystic">Mystique</option>
              <option value="warrior">Guerrière</option>
              <option value="duchess">Duchesse</option>
              <option value="amazon">Amazone</option>
              <option value="queen">Impératrice</option>
            </select>
          </div>

          <div class="field-group">
            <label for="worldSelect">Monde</label>
            <select id="worldSelect">
              <option value="moonlit kingdom">Royaume lunaire</option>
              <option value="sunset citadel">Citadelle du coucher</option>
              <option value="temple of ash">Temple des cendres</option>
              <option value="battle palace">Palais de guerre</option>
              <option value="sable empire">Empire du sable</option>
            </select>
          </div>

          <div class="field-group">
            <label for="moodSelect">Ambiance</label>
            <select id="moodSelect">
              <option value="dangerous">Dangereux</option>
              <option value="romantic">Romantique</option>
              <option value="mystic">Mystique</option>
              <option value="elegant">Élégant</option>
              <option value="royal">Royal</option>
            </select>
          </div>

          <div class="field-group">
            <label for="settingSelect">Décor</label>
            <select id="settingSelect">
              <option value="Penthouse à Paris">Penthouse à Paris</option>
              <option value="Villa au clair de lune">Villa au clair de lune</option>
              <option value="Roof lounge néon">Roof lounge néon</option>
              <option value="Villa sur île privée">Villa sur île privée</option>
              <option value="Théâtre classique">Théâtre classique</option>
            </select>
          </div>

          <div class="field-group">
            <label for="silhouetteSelect">Silhouette</label>
            <select id="silhouetteSelect">
              <option value="royal">Royale</option>
              <option value="amazon">Amazone</option>
              <option value="fitted">Cintrée</option>
              <option value="velvet">Velours</option>
            </select>
          </div>

          <div class="field-group">
            <label for="energySelect">Intensité</label>
            <select id="energySelect">
              <option value="1">Faible</option>
              <option value="2">Moyenne</option>
              <option value="3" selected>Élevée</option>
              <option value="4">Très élevée</option>
            </select>
          </div>

          <div class="field-group">
            <label for="imageUpload">Portrait personnalisé</label>
            <input id="imageUpload" type="file" accept="image/*" />
          </div>

          <div class="field-group">
            <label for="promptInput">Prompt personnalisé</label>
            <textarea id="promptInput" rows="6" placeholder="Collez ou modifiez le prompt ici..."></textarea>
          </div>

          <div class="action-row">
            <button id="generateBtn" class="btn-primary">Générer</button>
            <button id="shuffleBtn" class="btn-secondary">Aléatoire</button>
          </div>

          <div class="secondary-actions">
            <button id="copyPromptBtn" class="btn-ghost">Copier prompt</button>
            <button id="downloadJsonBtn" class="btn-ghost">JSON</button>
            <button id="exportPngBtn" class="btn-ghost">Exporter PNG</button>
          </div>
        </aside>

        <section class="panel preview-panel">
          <div class="character-card">
            <div class="portrait" aria-label="Portrait du personnage">
              <img id="portraitImage" class="portrait-image" alt="Portrait personnalisé" />
              <div class="halo"></div>
              <div class="hair"></div>
              <div class="face"></div>
              <div class="body"></div>
              <div class="detail one"></div>
              <div class="detail two"></div>
            </div>

            <div class="character-copy">
              <div class="name-row">
                <h2 id="characterName">Arielle Voss</h2>
                <h3 id="characterTitle">Princesse des ombres</h3>
              </div>

              <div class="tag-row">
                <span id="characterRole" class="tag">Mystique</span>
                <span id="characterSetting" class="tag">Penthouse à Paris</span>
                <span id="characterMood" class="tag">Romantique</span>
                <span id="characterWorld" class="tag">Royaume lunaire</span>
              </div>

              <div id="traitList" class="trait-list"></div>
            </div>
          </div>

          <div class="story-grid">
            <article class="story-card">
              <p class="eyebrow">Background</p>
              <h3>Histoire</h3>
              <p id="backstoryText"></p>
            </article>

            <article class="story-card">
              <p class="eyebrow">Prompt</p>
              <h3>Scène de génération</h3>
              <pre id="promptOutput"></pre>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
